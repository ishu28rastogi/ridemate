<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>RideMate | Logout</title>
  <link rel="stylesheet" href="logout.css">
</head>
<body>

  <div class="page-wrapper">
    <div class="logout-card">
      <h2>Logout</h2>
      <p>Are you sure you want to logout?</p>

      <div class="btn-group">
        <button class="btn yes" onclick="logoutUser()">Yes, Logout</button>
        <button class="btn no" onclick="cancelLogout()">Cancel</button>
      </div>
    </div>
  </div>

  <script src="logout.js"></script>
</body>
</html>
