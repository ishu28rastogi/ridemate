<!DOCTYPE html>
<html>
<head>
<title>RideMate Chatbot</title>

<style>

body{
background:#f1f5f9;
font-family: Arial;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
margin:0;
}

.chat-container{
width:100%;
height:100%;
display:flex;
flex-direction:column;
}

.header{
background:#03246b;
color:white;
padding:12px;
font-size:16px;
font-weight:bold;
text-align:center;
}

.chat-box{
flex:1;
padding:10px;
overflow-y:auto;
background:#f8fafc;
scroll-behavior:smooth;
}

.user{
background:#032671;
color:white;
padding:8px 12px;
border-radius:15px 15px 0 15px;
margin:6px 0;
max-width:70%;
margin-left:auto;
font-size:14px;
}

.bot{
background:#e2e8f0;
color:#1e293b;
padding:8px 12px;
border-radius:15px 15px 15px 0;
margin:6px 0;
max-width:70%;
font-size:14px;
}

.typing{
background:#e2e8f0;
padding:8px 12px;
border-radius:15px 15px 15px 0;
margin:6px 0;
width:60px;
display:flex;
gap:5px;
}

.typing span{
width:6px;
height:6px;
background:#053271;
border-radius:50%;
animation: blink 1.2s infinite;
}

.typing span:nth-child(2){animation-delay:0.2s;}
.typing span:nth-child(3){animation-delay:0.4s;}

@keyframes blink{
0%,100%{opacity:0.2;}
50%{opacity:1;}
}

.input-area{
display:flex;
border-top:1px solid #ddd;
}

.input-area input{
flex:1;
border:none;
padding:10px;
outline:none;
}

.input-area button{
background:#042a7b;
color:white;
border:none;
padding:10px 15px;
cursor:pointer;
}
</style>

</head>

<body>

<div class="chat-container">

<div class="header">
RideMate Assistant 🚗
</div>

<div id="chat-box" class="chat-box"></div>

<div class="input-area">
<input id="message" placeholder="Type your message...">
<button onclick="sendMessage()">Send</button>
</div>

</div>

<script>

function sendMessage(){

let msg=document.getElementById("message").value;

let chat=document.getElementById("chat-box");

chat.innerHTML+=`<div class="user">${msg}</div>`;

fetch("http://localhost:5050/chat", {
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({message:msg})
})
.then(res=>res.json())
.then(data=>{
chat.innerHTML+=`<div class="bot">${data.reply}</div>`;
chat.scrollTop=chat.scrollHeight;
});

document.getElementById("message").value="";
}
function sendMessage(){

let msg=document.getElementById("message").value;

if(msg.trim()=="") return;

let chat=document.getElementById("chat-box");

chat.innerHTML+=`<div class="user">${msg}</div>`;

fetch("http://localhost:5050/chat", {
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({message:msg})
})
.then(res=>res.json())
.then(data=>{
chat.innerHTML+=`<div class="bot">${data.reply}</div>`;
chat.scrollTop=chat.scrollHeight;
});

document.getElementById("message").value="";
}


// ENTER KEY SUPPORT
document.getElementById("message").addEventListener("keypress",function(event){

if(event.key==="Enter"){
event.preventDefault();
sendMessage();
}

});
</script>

</body>
</html>
